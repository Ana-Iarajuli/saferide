<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder hero art. Replace with a real photo (e.g. img/hero.jpg) and update the <img> in index.html. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1726"/>
      <stop offset="0.55" stop-color="#123049"/>
      <stop offset="0.6" stop-color="#0c2133"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="1" r="0.5">
      <stop offset="0" stop-color="#5cefff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5cefff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ee6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3ee6ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3ee6ff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>
  <ellipse cx="800" cy="480" rx="620" ry="210" fill="url(#sun)"/>

  <!-- far stars -->
  <g fill="#bff8ff" opacity="0.7">
    <circle cx="140" cy="90" r="1.6"/><circle cx="320" cy="160" r="1.2"/><circle cx="520" cy="70" r="1.4"/><circle cx="700" cy="140" r="1"/>
    <circle cx="930" cy="60" r="1.5"/><circle cx="1110" cy="150" r="1.1"/><circle cx="1290" cy="90" r="1.6"/><circle cx="1480" cy="170" r="1.2"/>
  </g>

  <!-- mountains (outlined, Caucasus-like peaks) -->
  <path d="M0 480 L120 400 L210 440 L330 330 L420 400 L520 350 L640 430 L720 380 L800 460 L880 370 L990 300 L1080 380 L1170 340 L1290 420 L1400 350 L1500 410 L1600 380 L1600 480 Z"
        fill="#0b2131" stroke="#3ee6ff" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M0 480 L90 450 L200 470 L300 420 L410 465 L560 430 L700 470 L860 440 L1000 470 L1140 430 L1260 465 L1380 440 L1500 470 L1600 450 L1600 480 Z"
        fill="#0e2a3d" stroke="#3ee6ff" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M990 300 L1030 335 L1010 340 L1050 362" fill="none" stroke="#e8fdff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- horizon -->
  <rect x="0" y="478" width="1600" height="4" fill="#5cefff" filter="url(#soft)"/>
  <rect x="0" y="479" width="1600" height="2" fill="#d6fcff"/>

  <!-- perspective grid floor -->
  <g stroke="url(#floorFade)" stroke-width="2" fill="none">
    <path d="M800 480 L-1200 800 M800 480 L-600 800 M800 480 L-150 800 M800 480 L250 800 M800 480 L560 800 M800 480 L800 800 M800 480 L1040 800 M800 480 L1350 800 M800 480 L1750 800 M800 480 L2200 800 M800 480 L2800 800"/>
    <path d="M0 492 H1600 M0 508 H1600 M0 530 H1600 M0 560 H1600 M0 600 H1600 M0 652 H1600 M0 720 H1600 M0 800 H1600"/>
  </g>

  <!-- light trail behind the bike -->
  <rect x="0" y="672" width="905" height="10" fill="url(#trail)" filter="url(#soft)"/>
  <rect x="0" y="675" width="905" height="4" fill="url(#trail)"/>

  <!-- the SafeRide bike, side view (same drawing as the logo) -->
  <g transform="translate(1070 610) scale(5.6)" fill="none" stroke="#3ee6ff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M41 -7 L23 -21 L8 -18 C2 -17 -2 -13 -8 -12 L-24 -14 L-36 -17" stroke-width="2.4"/>
    <path d="M37 -3 L22 -6 L6 4 L-14 4 L-21 -5" stroke-width="2"/>
    <path d="M29 -13 L11 -11 L-3 -3" stroke-width="2.8"/>
    <path d="M30 0 L25 -13 M-30 0 L-13 2" stroke-width="1.8"/>
    <circle cx="-30" cy="0" r="11" stroke-width="2.8"/>
    <circle cx="-30" cy="0" r="4.5" stroke-width="1.4"/>
    <circle cx="30" cy="0" r="11" stroke-width="2.8"/>
    <circle cx="30" cy="0" r="4.5" stroke-width="1.4"/>
  </g>
  <!-- reflection -->
  <ellipse cx="1070" cy="684" rx="260" ry="10" fill="#3ee6ff" opacity="0.25" filter="url(#soft)"/>
</svg>
